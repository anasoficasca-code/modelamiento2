<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulación 3D de tránsito — Kennedy</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="navigation-unified.css?v=20260824">
<style>
  :root{
    --bg:#0b0c0f; --panel:rgba(255,255,255,.06); --panel-border:rgba(255,255,255,.12);
    --ink:#e8ecf1; --ink-dim:#8b96a5; --accent:#24c8bd;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{ background:var(--bg); color:var(--ink); font-family:Inter,Arial,sans-serif; overflow:hidden; }
  .app{ display:flex; min-height:100vh; }
  .main{ flex:1; position:relative; min-width:0; }
  #sceneWrap{ position:absolute; inset:0; }
  #sceneCanvas{ position:absolute; inset:0; display:block; width:100%; height:100%; }

  .hud-title{
    position:absolute; top:18px; left:18px; z-index:5; pointer-events:none;
  }
  .hud-title h1{ font-size:15px; font-weight:600; margin:0 0 3px; }
  .hud-title p{ font-size:11.5px; color:var(--ink-dim); margin:0; }

  .status-overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; color:var(--ink-dim); background:rgba(11,12,15,.6); z-index:8; text-align:center; padding:20px;
  }
  .status-overlay.hide{ display:none; }

  .controls-bar{
    position:absolute; left:50%; bottom:20px; transform:translateX(-50%); z-index:6;
    display:flex; align-items:center; gap:12px; padding:10px 16px; border-radius:14px;
    background:rgba(17,20,24,.9); border:1px solid var(--panel-border); backdrop-filter:blur(6px);
    max-width:92vw;
  }
  .controls-bar button{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--panel-border); background:var(--panel);
    color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px;
  }
  .controls-bar button:hover{ background:rgba(255,255,255,.12); }
  .controls-bar input[type=range]{ width:min(38vw,340px); accent-color:var(--accent); }
  .controls-bar .time-label{ font-size:11.5px; color:var(--ink-dim); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .controls-bar select{
    background:var(--panel); color:var(--ink); border:1px solid var(--panel-border); border-radius:8px;
    font-size:11.5px; padding:5px 8px;
  }

  .view-buttons{
    position:absolute; top:18px; right:18px; z-index:6; display:flex; flex-direction:column; gap:6px;
  }
  .view-buttons button{
    padding:8px 12px; border-radius:9px; border:1px solid var(--panel-border); background:rgba(17,20,24,.85);
    color:var(--ink); font-size:11.5px; cursor:pointer; text-align:left;
  }
  .view-buttons button:hover{ background:rgba(255,255,255,.1); }

  .legend{
    position:absolute; bottom:78px; left:18px; z-index:5; font-size:11px; color:var(--ink-dim);
    background:rgba(17,20,24,.8); border:1px solid var(--panel-border); border-radius:10px; padding:10px 12px;
    display:flex; flex-direction:column; gap:5px;
  }
  .legend span{ display:flex; align-items:center; gap:7px; }
  .legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar sidebar-icons-only">
    <div class="brand-icon"><i class="fa-solid fa-diagram-project"></i></div>
    <nav class="icon-nav">
      <a href="modulo-02.html" class="icon-nav-item" title="Medir la Red"><i class="fa-solid fa-chart-simple"></i></a>
      <a href="modulo-03.html" class="icon-nav-item" title="Discurso vs Realidad"><i class="fa-solid fa-eye"></i></a>
      <a href="modulo-04.html" class="icon-nav-item" title="Macromodelos"><i class="fa-solid fa-bullseye"></i></a>
      <a href="modulo-05.html" class="icon-nav-item" title="Lo que no está"><i class="fa-solid fa-magnifying-glass"></i></a>
      <a href="modulo-06.html" class="icon-nav-item" title="POT ↔ ODS"><i class="fa-solid fa-earth-americas"></i></a>
      <a href="modulo-07.html" class="icon-nav-item" title="Simulador"><i class="fa-solid fa-flask"></i></a>
      <a href="modulo-08.html" class="icon-nav-item" title="Modelo Propio (2D)"><i class="fa-solid fa-city"></i></a>
      <a href="modulo-08-3d.html" class="icon-nav-item active" title="Modelo Propio (3D)"><i class="fa-solid fa-cube"></i></a>
      <a href="red-residuos-organicos.html" class="icon-nav-item" title="Problemas de Kennedy"><i class="fa-solid fa-triangle-exclamation"></i></a>
    </nav>
    <div class="icon-nav-footer">
      <a href="configuracion.html" class="icon-nav-item" title="Configuración"><i class="fa-solid fa-gear"></i></a>
      <a href="demo.html" class="icon-nav-item" title="Salir"><i class="fa-solid fa-arrow-right-from-bracket"></i></a>
    </div>
  </aside>
  <main class="main">
    <div id="sceneWrap">
      <canvas id="sceneCanvas"></canvas>
    </div>

    <div class="hud-title">
      <h1>Simulación 3D de tránsito — Kennedy</h1>
      <p>Proyección axonométrica a 45° · arrastra para girar alrededor · rueda para zoom · clic derecho para mover la vista</p>
    </div>

    <div class="view-buttons">
      <button type="button" id="viewReset">Restablecer vista axonométrica</button>
    </div>

    <div class="legend">
      <span><i style="background:#e2635a"></i> Vehículo</span>
      <span><i style="background:#3a4148"></i> Vía</span>
      <span><i style="background:#3d4450"></i> Edificio</span>
      <span><i style="background:#3f6b3f"></i> Árbol</span>
      <span><i style="background:#2f6fa8"></i> Cuerpo de agua</span>
    </div>

    <div class="controls-bar">
      <button type="button" id="playPause" aria-label="Reproducir / pausar"><i class="fa-solid fa-play"></i></button>
      <input type="range" id="timeSlider" min="0" max="1000" value="0" step="1" disabled>
      <span class="time-label" id="timeLabel">00:00 / 00:00</span>
      <select id="speedSelect">
        <option value="1">1×</option>
        <option value="2" selected>2×</option>
        <option value="4">4×</option>
        <option value="8">8×</option>
      </select>
    </div>

    <div class="status-overlay" id="statusOverlay">Cargando red vial…</div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="modulo-08-3d.js?v=1"></script>
</body>
</html>
