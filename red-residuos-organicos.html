  function forceLayout(nodeList, edgeList, centerX, centerY, spread, radiusOf, gapMult, margin, iterations = 300) {
    const pos = {};
    const areaW = mainW() - margin * 2, areaH = mainH() - margin * 2;
    const cols = Math.ceil(Math.sqrt(nodeList.length * areaW / areaH));
    const rows = Math.ceil(nodeList.length / cols);
    nodeList.forEach((n, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const jitter = () => (Math.random() - 0.5) * 0.3;
      pos[n.id] = { x: margin + (areaW * (col + 0.5 + jitter())) / cols, y: margin + (areaH * (row + 0.5 + jitter())) / rows };
    });

    function minDistFor(a, b) { return (radiusOf(a) + radiusOf(b)) * gapMult; }

      const force = {}; ids.forEach(id => force[id] = { x: 0, y: 0 });
      for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
        const a = pos[ids[i]], b = pos[ids[j]];
        const minDist = minDistFor(ids[i], ids[j]);
        let dx = a.x - b.x, dy = a.y - b.y;
        let dist = Math.hypot(dx, dy) || 0.001;
        if (dist < minDist) {
          if (dist < 0.01) { dx = (Math.random() - 0.5) * 2; dy = (Math.random() - 0.5) * 2; dist = Math.hypot(dx, dy); }
          const overlap = (minDist - dist) / 2, ux = dx / dist, uy = dy / dist;
          force[ids[i]].x += ux * overlap; force[ids[i]].y += uy * overlap;
          force[ids[j]].x -= ux * overlap; force[ids[j]].y -= uy * overlap;
        }
      }
      edgeList.forEach(e => {
        const a = pos[e.from], b = pos[e.to];
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.hypot(dx, dy) || 0.001;
        const target = minDistFor(e.from, e.to) * 1.3;
        const pull = (dist - target) * 0.014;
        force[e.from].x += dx / dist * pull; force[e.from].y += dy / dist * pull;
        force[e.to].x -= dx / dist * pull; force[e.to].y -= dy / dist * pull;
      });
      ids.forEach(id => {
        pos[id].x += force[id].x; pos[id].y += force[id].y;
        pos[id].x += (centerX - pos[id].x) * 0.0008;
        pos[id].y += (centerY - pos[id].y) * 0.0008;
        if (pos[id].x < margin) pos[id].x += (margin - pos[id].x) * 0.45;
        if (pos[id].x > mainW() - margin) pos[id].x -= (pos[id].x - (mainW() - margin)) * 0.45;
        if (pos[id].y < margin) pos[id].y += (margin - pos[id].y) * 0.45;
        if (pos[id].y > mainH() - margin) pos[id].y -= (pos[id].y - (mainH() - margin)) * 0.45;
      });
    }
    for (let pass = 0; pass < 320; pass++) {
      for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
        const a = pos[ids[i]], b = pos[ids[j]];
        const minDist = minDistFor(ids[i], ids[j]);
        let dx = a.x - b.x, dy = a.y - b.y;
        let dist = Math.hypot(dx, dy) || 0.001;
        if (dist < minDist) {
          if (dist < 0.01) { dx = (Math.random() - 0.5) * 2; dy = (Math.random() - 0.5) * 2; dist = Math.hypot(dx, dy); }
          const overlap = (minDist - dist) / 2, ux = dx / dist, uy = dy / dist;
          a.x += ux * overlap; a.y += uy * overlap; b.x -= ux * overlap; b.y -= uy * overlap;
        }
      }
    }
    ids.forEach(id => {
      const r = radiusOf(id);
      pos[id].x = Math.max(margin + r * 0.2, Math.min(mainW() - margin - r * 0.2, pos[id].x));
      pos[id].y = Math.max(margin + r * 0.2, Math.min(mainH() - margin - r * 0.2, pos[id].y));
    });
    return pos;
  }

  function el(cls) { const d = document.createElement("div"); d.className = cls; return d; }
  function size(elm, r) { elm.style.width = elm.style.height = r * 2 + "px"; }
  function place(elm, x, y) { elm.style.left = x + "px"; elm.style.top = y + "px"; }
  function wrapToFit(text, maxCharsPerLine, maxLines) {
    const words = text.split(" ");
    const lines = []; let current = "";
    words.forEach(w => {
      const candidate = current ? current + " " + w : w;
      if (candidate.length > maxCharsPerLine && current) { lines.push(current); current = w; }
      else current = candidate;
    });
    if (current) lines.push(current);
    if (lines.length > maxLines) {
      const shown = lines.slice(0, maxLines);
      let last = shown[maxLines - 1];
      while (last.length > 3 && (last + "…").length > maxCharsPerLine) last = last.slice(0, -1).trim();
      shown[maxLines - 1] = last.replace(/[.,;:]+$/, "") + "…";
      return shown.join("<br>");
    }
    return lines.join("<br>");
  }

  const centerBlob = el("blob"); gooLayer.appendChild(centerBlob);
  const centerLabel = el("label center-label");
  centerLabel.style.width = (CENTER_R * 1.65) + "px";
  centerLabel.textContent = "Corabastos y su entorno";
  labelLayer.appendChild(centerLabel);
  const hitCenter = el("hit"); labelLayer.appendChild(hitCenter);

  let level = "none";
  let currentDetailId = null;
  let nodeBlobs = {}, nodeLabels = {}, nodeHits = {}, nodeRadiusMap = {};
  let bridgeEls = [];
  let arrowEls = [];
  let activeNodes = [], activeRel = [], nodePos = {};
  const SVGNS = "http://www.w3.org/2000/svg";
  const arrowsSvg = document.getElementById("arrowsSvg");
  const arrowDefs = arrowsSvg.querySelector("defs");
  const arrowMarkerCache = {};
  function ensureArrowMarker(color) {
    const key = color.replace(/[^a-zA-Z0-9]/g, "");
    if (arrowMarkerCache[key]) return key;
    const marker = document.createElementNS(SVGNS, "marker");
    marker.setAttribute("id", "arrow-" + key);
    marker.setAttribute("viewBox", "0 0 10 10");
    marker.setAttribute("refX", "8"); marker.setAttribute("refY", "5");
    marker.setAttribute("markerWidth", "7"); marker.setAttribute("markerHeight", "7");
    marker.setAttribute("orient", "auto-start-reverse");
    const path = document.createElementNS(SVGNS, "path");
    path.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
    path.setAttribute("fill", color);
    marker.appendChild(path);
    arrowDefs.appendChild(marker);
    arrowMarkerCache[key] = true;
    return key;
  }

  function clearNetwork() {
    Object.values(nodeBlobs).forEach(b => b.remove());
    Object.values(nodeLabels).forEach(l => l.remove());
    Object.values(nodeHits).forEach(h => h.remove());
    bridgeEls.forEach(b => b.remove());
    arrowEls.forEach(a => a.remove());
    nodeBlobs = {}; nodeLabels = {}; nodeHits = {}; bridgeEls = []; arrowEls = []; nodeRadiusMap = {};
  }

  function hexToRgb(hex) {
    const h = hex.replace("#", "");
    return { r: parseInt(h.substring(0, 2), 16), g: parseInt(h.substring(2, 4), 16), b: parseInt(h.substring(4, 6), 16) };
  }
  function lerpColor(c1, c2, t) {
    const a = hexToRgb(c1), b = hexToRgb(c2);
    const r = Math.round(a.r + (b.r - a.r) * t), g = Math.round(a.g + (b.g - a.g) * t), bl = Math.round(a.b + (b.b - a.b) * t);
    return `rgb(${r},${g},${bl})`;
  }

  function buildNetwork(nodes, rel, byIdMap, opts) {
    clearNetwork();
    activeNodes = nodes; activeRel = rel;
    const colorOf = opts.colorOf || (() => "var(--node)");
    const degree = {};
    nodes.forEach(n => degree[n.id] = 0);
    rel.forEach(r => { degree[r.from]++; degree[r.to]++; });
    const degValues = Object.values(degree);
    const degMin = Math.min(...degValues), degMax = Math.max(...degValues);
    NODE_R = Math.max(30, Math.min(opts.maxR, mainW() * opts.wFrac));
    const R_MIN = NODE_R * 0.85, R_MAX = NODE_R * 1.5;
    nodes.forEach(n => {
      const t = degMax === degMin ? 0.5 : (degree[n.id] - degMin) / (degMax - degMin);
      nodeRadiusMap[n.id] = R_MIN + (R_MAX - R_MIN) * Math.sqrt(t);
    });
    function radiusOf(id) { return nodeRadiusMap[id]; }
    const margin = Math.max(50, Math.min(150, mainW() * 0.07));
    const cx = mainW() / 2, cy = mainH() / 2 + 10;
    const spread = Math.min(mainW() - margin * 2, mainH() - margin * 2) * 0.55;
    const avgR = degValues.reduce((s, d) => s + (R_MIN + (R_MAX - R_MIN) * Math.sqrt(degMax === degMin ? 0.5 : (d - degMin) / (degMax - degMin))), 0) / nodes.length;
    const area = (mainW() - margin * 2) * (mainH() - margin * 2);
    const maxFeasible = 2 * Math.sqrt((area * 0.68) / (nodes.length * Math.PI));
    const gapMult = Math.min(1.8, Math.max(1.3, maxFeasible / (avgR * 2)));

    function segInt(p1, p2, p3, p4) {
      const d1x = p2.x - p1.x, d1y = p2.y - p1.y, d2x = p4.x - p3.x, d2y = p4.y - p3.y;
      const denom = d1x * d2y - d1y * d2x;
      if (Math.abs(denom) < 1e-9) return false;
      const t = ((p3.x - p1.x) * d2y - (p3.y - p1.y) * d2x) / denom;
      const u = ((p3.x - p1.x) * d1y - (p3.y - p1.y) * d1x) / denom;
      return t > 0.05 && t < 0.95 && u > 0.05 && u < 0.95;
    }
    function countCrossings(pos) {
      let c = 0;
      for (let i = 0; i < rel.length; i++) for (let j = i + 1; j < rel.length; j++) {
        const a = rel[i], b = rel[j];
        if (a.from === b.from || a.from === b.to || a.to === b.from || a.to === b.to) continue;
        if (segInt(pos[a.from], pos[a.to], pos[b.from], pos[b.to])) c++;
      }
      return c;
    }
    let best = null, bestC = Infinity;
    for (let attempt = 0; attempt < 25; attempt++) {
      const cand = forceLayout(nodes, rel, cx, cy, spread, radiusOf, gapMult, margin);
      const c = countCrossings(cand);
      if (c < bestC) { bestC = c; best = cand; }
      if (bestC === 0) break;
    }
    nodePos = best;

    nodes.forEach(n => {
      const b = el("blob"); gooLayer.appendChild(b); nodeBlobs[n.id] = b;
      b.style.background = colorOf(n.id);
      const l = el("label child-label");
      const ownR = nodeRadiusMap[n.id];
      const fontPx = 11.5, lineH = fontPx * 1.24;
      // Calculo consciente de la curva del circulo: la linea mas alejada
      // del centro (arriba/abajo del bloque de texto) tiene MENOS ancho
      // disponible que una linea justo en el medio — se usa el ancho
      // seguro en el punto mas angosto que realmente vaya a ocupar el
      // texto, no un ancho fijo que ignore la curva.
      let maxLines = Math.max(2, Math.floor((ownR * 2 * 0.8) / lineH));
      let halfH = (maxLines * lineH) / 2;
      while (halfH >= ownR * 0.85 && maxLines > 1) { maxLines--; halfH = (maxLines * lineH) / 2; }
      const safeWidth = 2 * Math.sqrt(Math.max(0, ownR * ownR - halfH * halfH)) * 0.86;
      l.style.width = safeWidth + "px";
      const maxCharsPerLine = Math.max(5, Math.floor(safeWidth / (fontPx * 0.58)));
      const text = byIdMap[n.id].corto || byIdMap[n.id].t;
      l.innerHTML = wrapToFit(text, maxCharsPerLine, maxLines);
      labelLayer.appendChild(l); nodeLabels[n.id] = l;
      const h = el("hit"); labelLayer.appendChild(h); nodeHits[n.id] = h;
      place(nodeBlobs[n.id], nodePos[n.id].x, nodePos[n.id].y); size(nodeBlobs[n.id], ownR);
      place(l, nodePos[n.id].x, nodePos[n.id].y);
      size(h, ownR); place(h, nodePos[n.id].x, nodePos[n.id].y);
    });
    const BRIDGES = 45;
    rel.forEach(r => {
      const a = nodePos[r.from], b = nodePos[r.to];
      const rFrom = nodeRadiusMap[r.from], rTo = nodeRadiusMap[r.to];
      const colorFrom = colorOf(r.from), colorTo = colorOf(r.to);
      for (let j = 0; j < BRIDGES; j++) {
        const t = (j + 1) / (BRIDGES + 1);
        const rr = ((rFrom * (1 - t) + rTo * t) * (1 - t * 0.35)) * 0.17;
        const bridge = el("blob"); gooLayer.appendChild(bridge); bridgeEls.push(bridge);
        if (colorFrom.startsWith("#") && colorTo.startsWith("#")) bridge.style.background = lerpColor(colorFrom, colorTo, t);
        size(bridge, rr); place(bridge, a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t);
      }
      // Flecha nítida encima de la conexion organica, para que se entienda
      // la DIRECCION causa -> efecto (diagrama causal, no solo una mancha
      // sin sentido de flujo).
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy) || 1;
      const ux = dx / dist, uy = dy / dist;
      const startX = a.x + ux * (rFrom + 4), startY = a.y + uy * (rFrom + 4);
      const endX = b.x - ux * (rTo + 4), endY = b.y - uy * (rTo + 4);
      const arrowColorRaw = colorTo.startsWith("#") ? colorTo : getComputedStyle(document.documentElement).getPropertyValue("--node").trim();
      const markerKey = ensureArrowMarker(arrowColorRaw);
      const line = document.createElementNS(SVGNS, "line");
      line.setAttribute("class", "arrow-line");
      line.setAttribute("x1", startX); line.setAttribute("y1", startY);
      line.setAttribute("x2", endX); line.setAttribute("y2", endY);
      line.setAttribute("stroke", arrowColorRaw);
      line.setAttribute("stroke-width", "2.4");
      line.setAttribute("stroke-opacity", "0.85");
      line.setAttribute("marker-end", `url(#arrow-${markerKey})`);
      arrowsSvg.appendChild(line); arrowEls.push(line);
    });
  }

  function showMacro() {
    level = "macro"; currentDetailId = null;
    buildNetwork(MACRO, MACRO_REL, macroById, { maxR: 78, wFrac: 0.1, colorOf: (id) => macroById[id].color });
    intro.style.opacity = "0";
    levelTitle.classList.add("show");
    levelTitleText.textContent = "8 problemáticas de Corabastos y su entorno";
    levelSubText.textContent = "Toca cualquier problema para ver sus causas internas";
    backBtn.classList.remove("show");
    centerBlob.style.opacity = "0"; centerLabel.style.opacity = "0"; hitCenter.style.pointerEvents = "none";
  }

  function showDetail(macroId) {
    level = "detail"; currentDetailId = macroId;
    const sub = SUBNETS[macroId];
    const byId = {}; sub.nodes.forEach(n => byId[n.id] = n);
    const macroColor = macroById[macroId].color;
    buildNetwork(sub.nodes, sub.rel, byId, { maxR: 66, wFrac: 0.09, colorOf: () => macroColor });
    levelTitleText.textContent = macroById[macroId].full;
    levelSubText.textContent = "Causas internas de esta problemática — toca una causa para ver más";
    backBtn.textContent = "← Volver a las 8 problemáticas";
    backBtn.classList.add("show");
    document.getElementById("panel").classList.remove("open");
  }

  function backAction() {
    if (level === "detail") { showMacro(); return; }
    level = "none"; currentDetailId = null;
    clearNetwork();
    intro.style.opacity = "1";
    levelTitle.classList.remove("show");
    backBtn.classList.remove("show");
    centerBlob.style.opacity = "1"; centerLabel.style.opacity = "1"; hitCenter.style.pointerEvents = "auto";
    document.getElementById("panel").classList.remove("open");
  }
  backBtn.addEventListener("click", backAction);

  place(centerBlob, mainW() / 2, mainH() / 2 + 10); size(centerBlob, CENTER_R);
  place(centerLabel, mainW() / 2, mainH() / 2 + 10);
  place(hitCenter, mainW() / 2, mainH() / 2 + 10); size(hitCenter, CENTER_R);

  const stage = document.getElementById("stage");
  let downStart = null, downTarget = null;
  stage.addEventListener("pointerdown", (e) => { downStart = { x: e.clientX, y: e.clientY }; downTarget = e.target; });
  window.addEventListener("pointerup", (e) => {
    if (!downStart) return;
    const moved = Math.hypot(e.clientX - downStart.x, e.clientY - downStart.y);
    downStart = null;
    if (moved >= 8) return;
    if (downTarget === hitCenter) { showMacro(); return; }
    const nid = Object.keys(nodeHits).find(id => nodeHits[id] === downTarget);
    if (!nid) return;
    // Clic directo en un nodo: si estamos en la red macro, entra directo a
    // la red de sub-problematicas de esa problemática (sin pasar por el
    // panel); si ya estamos en un detalle, el clic abre el panel normal
    // con la informacion de esa causa.
    if (level === "macro") showDetail(nid);
    else openPanel(nid);
  });

  // Mostrar la red de las 8 problematicas directamente al abrir la pagina,
  // sin necesidad de tocar primero la burbuja inicial.
  showMacro();

  function openPanel(id) {
    const panel = document.getElementById("panel"), body = document.getElementById("panelBody");
    if (level === "macro") {
      const n = macroById[id];
      const vieneDe = MACRO_REL.filter(r => r.to === id).map(r => ({ n: macroById[r.from], verbo: r.verbo }));
      const alimentaA = MACRO_REL.filter(r => r.from === id).map(r => ({ n: macroById[r.to], verbo: r.verbo }));
      body.innerHTML = `
        <p class="panel-kind">Problemática</p>
        <h2>${n.full}</h2>
        ${vieneDe.length ? `<div class="block"><b>Viene de</b>${vieneDe.map(x => `<div class="rel-chip" data-goto="${x.n.id}">${x.n.corto}<span class="rel-verbo">${x.verbo}</span></div>`).join("")}</div>` : ""}
        ${alimentaA.length ? `<div class="block"><b>Alimenta a</b>${alimentaA.map(x => `<div class="rel-chip" data-goto="${x.n.id}">${x.n.corto}<span class="rel-verbo">${x.verbo}</span></div>`).join("")}</div>` : ""}
        <button class="drill-btn" id="drillBtn">Ver causas internas de esta problemática →</button>
      `;
      body.querySelectorAll("[data-goto]").forEach(elm => elm.addEventListener("click", (e) => { e.stopPropagation(); openPanel(elm.dataset.goto); }));
      document.getElementById("drillBtn").addEventListener("click", (e) => { e.stopPropagation(); showDetail(id); });
    } else if (level === "detail") {
      const sub = SUBNETS[currentDetailId];
      const byId = {}; sub.nodes.forEach(n => byId[n.id] = n);
      const n = byId[id];
      const vieneDe = sub.rel.filter(r => r.to === id).map(r => byId[r.from]);
      const alimentaA = sub.rel.filter(r => r.from === id).map(r => byId[r.to]);
      const esLoop = sub.rel.some(r => r.loop && (r.from === id || r.to === id));
      body.innerHTML = `
        <p class="panel-kind">Causa (${macroById[currentDetailId].corto})</p>
        <h2>${n.t}</h2>
        ${vieneDe.length ? `<div class="block"><b>Viene de</b>${vieneDe.map(x => `<div class="rel-chip" data-goto="${x.id}">${x.t}</div>`).join("")}</div>` : ""}
        ${alimentaA.length ? `<div class="block"><b>Alimenta a</b>${alimentaA.map(x => `<div class="rel-chip" data-goto="${x.id}">${x.t}</div>`).join("")}</div>` : ""}
        ${esLoop ? `<div class="block"><b>Bucle de retroalimentación</b><p style="font-size:12.5px;color:var(--ink-dark);margin:0;font-style:italic;">${sub.loopNote}</p></div>` : ""}
      `;
      body.querySelectorAll("[data-goto]").forEach(elm => elm.addEventListener("click", (e) => { e.stopPropagation(); openPanel(elm.dataset.goto); }));
    }
    panel.classList.add("open");
  }
  document.getElementById("panelClose").addEventListener("click", () => document.getElementById("panel").classList.remove("open"));

  window.addEventListener("resize", () => {
    place(centerBlob, mainW() / 2, mainH() / 2 + 10);
    place(centerLabel, mainW() / 2, mainH() / 2 + 10);
    place(hitCenter, mainW() / 2, mainH() / 2 + 10);
    if (level === "macro") buildNetwork(MACRO, MACRO_REL, macroById, { maxR: 78, wFrac: 0.1, colorOf: (id) => macroById[id].color });
    else if (level === "detail") { const sub = SUBNETS[currentDetailId]; const byId = {}; sub.nodes.forEach(n => byId[n.id] = n); const macroColor = macroById[currentDetailId].color; buildNetwork(sub.nodes, sub.rel, byId, { maxR: 66, wFrac: 0.09, colorOf: () => macroColor }); }
  });
})();
</script>
