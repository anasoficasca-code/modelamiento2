<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Problemas · Kennedy, Corabastos — RAPOT</title>
<meta name="description" content="Cinco lecturas axonométricas del colapso operativo y logístico de Kennedy frente a la capacidad de soporte del territorio, en una sola pantalla.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#050308; --panel:#0c0a14; --panel2:#130f1f; --ice:#f4f2ff; --dim:#9a93ad;
  --violet:#8052ff; --violet-dim:rgba(128,82,255,.15); --amber:#ffb829;
  --font:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --pad:clamp(20px,4vw,64px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{background:var(--void)}
body{font-family:var(--font);font-weight:200;background:var(--void);color:var(--dim);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
.wrap{max-width:1400px;margin:0 auto;padding:0 var(--pad);width:100%}

/* ---------- constelacion decorativa (fondo del hero) ---------- */
#cloud{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}

/* ---------- nav ---------- */
.nav{position:relative;z-index:3;padding-top:env(safe-area-inset-top,0px);flex:none}
.nav-in{height:76px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ice);font-weight:500;font-size:16px}
.brand svg{width:26px;height:26px}
.back{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px;border:1px solid rgba(244,242,255,.16);border-radius:999px;padding:9px 16px;transition:border-color .2s ease,color .2s ease}
.back:hover{color:var(--ice);border-color:rgba(244,242,255,.4)}

/* ---------- hero ---------- */
.hero{position:relative;z-index:2;padding:36px 0 44px;flex:none}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.04em;color:var(--amber)}
.hero h1{margin-top:18px;font-weight:400;color:var(--ice);letter-spacing:-.03em;line-height:1.04;
  font-size:clamp(2rem,4.6vw,3.6rem);max-width:20ch}
.hero p{margin-top:18px;max-width:60ch;font-size:17px;font-weight:200;color:var(--dim)}

/* ---------- pestañas ---------- */
.tabs{position:relative;z-index:2;flex:none;border-top:1px solid rgba(244,242,255,.1);border-bottom:1px solid rgba(244,242,255,.1)}
.tabs-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:1 1 0;min-width:168px;display:flex;flex-direction:column;gap:8px;padding:18px 20px;border-bottom:2px solid transparent;transition:background .2s ease,border-color .2s ease}
.tab .n{font:500 11px/1 var(--font);letter-spacing:.1em;color:var(--c,var(--dim))}
.tab .t{font-size:14px;color:var(--dim);font-weight:400;letter-spacing:-.005em;transition:color .2s ease}
.tab:hover{background:rgba(244,242,255,.04)}
.tab.active{border-color:var(--c,var(--violet));background:rgba(244,242,255,.05)}
.tab.active .t{color:var(--ice)}

/* ---------- escenario ---------- */
.stage-wrap{position:relative;flex:1;min-height:0}
.stage{position:absolute;inset:0}
.stage iframe{width:100%;height:100%;border:0;display:block;background:var(--void)}
#wipe{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .38s ease}
#wipe.show{opacity:1}
#wipe .label{font:500 11px/1 var(--font);letter-spacing:.16em;text-transform:uppercase;color:#050308;text-align:center}
#wipe .label b{display:block;font-weight:500;font-size:16px;letter-spacing:-.01em;text-transform:none;margin-top:8px}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .hero{padding:28px 0 24px}
  .tab{min-width:130px;padding:14px 14px}
  .tab .t{font-size:12.5px}
  .hero p{display:none}
}
@media (prefers-reduced-motion:reduce){
  #wipe{transition:opacity .01ms}
}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="v2.html" aria-label="RAPOT">
      <svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="none" stroke="#ffb829" stroke-opacity=".5" stroke-width="1.2"/><circle cx="17" cy="9" r="3" fill="#f4f2ff"/><circle cx="10" cy="21" r="3" fill="#f4f2ff"/><circle cx="24" cy="21" r="3" fill="#f4f2ff"/></svg>
      RAPOT
    </a>
    <a class="back" href="v2.html">&larr; Volver</a>
  </div>
</header>

<section class="hero">
  <canvas id="cloud" aria-hidden="true"></canvas>
  <div class="wrap" style="position:relative">
    <p class="eyebrow">KENNEDY · CORABASTOS</p>
    <h1>Un territorio que ya no alcanza a sostener su propio modelo de ocupación.</h1>
    <p>Cinco lecturas del mismo lugar, cada una desde su propio corte axonométrico — todas en esta misma pantalla.</p>
  </div>
</section>

<nav class="tabs">
  <div class="wrap tabs-in" id="tabs"></div>
</nav>

<div class="stage-wrap">
  <div class="stage">
    <iframe id="stageFrame" title="Escena axonométrica" loading="eager"></iframe>
  </div>
  <div id="wipe"><div class="label" id="wipeLabel"></div></div>
</div>

<script>
(function(){
'use strict';
var SCENES = [
  { c:'#8052ff', n:'01', t:'Simulación 3D de tránsito', href:'modulo-08-3d.html' },
  { c:'#ffb829', n:'02', t:'Corte axonométrico', href:'modulo-10-corte.html' },
  { c:'#8052ff', n:'03', t:'Conectografías', href:'modulo-conectografias.html' },
  { c:'#ffb829', n:'04', t:'Problemáticas de Kennedy', href:'modulo-12-problemas.html' },
  { c:'#8052ff', n:'05', t:'Colapso operativo y logístico', href:'red-residuos-organicos.html' }
];
var tabs = document.getElementById('tabs');
tabs.innerHTML = SCENES.map(function(s,i){
  return '<button type="button" class="tab" style="--c:'+s.c+'" data-i="'+i+'"><span class="n">'+s.n+'</span><span class="t">'+s.t+'</span></button>';
}).join('');

var frame = document.getElementById('stageFrame');
var wipe = document.getElementById('wipe'), wipeLabel = document.getElementById('wipeLabel');
var current = -1, hideTimer = null;

function hideWipe(){
  clearTimeout(hideTimer);
  wipe.classList.remove('show');
}

function go(i, instant){
  if (i === current) return;
  current = i;
  [].forEach.call(tabs.children, function(el, idx){ el.classList.toggle('active', idx === i); });
  var s = SCENES[i];
  if (instant){
    frame.src = s.href + '?embed=1&c=' + s.c.slice(1);
    return;
  }
  wipe.style.background = s.c;
  wipeLabel.innerHTML = 'Entrando<b>' + s.t + '</b>';
  wipe.classList.add('show');
  setTimeout(function(){
    frame.src = s.href + '?embed=1&c=' + s.c.slice(1);
  }, 260);
  /* tope de seguridad: si el iframe tarda en cargar sus scripts pesados
     (three.js desde CDN), el overlay igual se retira a tiempo */
  clearTimeout(hideTimer);
  hideTimer = setTimeout(hideWipe, 1800);
}
frame.addEventListener('load', function(){
  setTimeout(hideWipe, 320);
});

[].forEach.call(tabs.children, function(el, idx){
  el.addEventListener('click', function(){ go(idx, false); });
});

var hash = (location.hash || '').replace('#', '');
var startIdx = SCENES.findIndex(function(s){ return s.href === hash; });
go(startIdx >= 0 ? startIdx : 0, true);

/* ================= constelacion decorativa del hero (Dala) ================= */
var canvas = document.getElementById('cloud'), ctx = canvas.getContext('2d');
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
var COLORS = ['#8052ff', '#ffb829', '#15846e', '#b79bff'];
function resize(){
  var r = canvas.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();
var N = W < 700 ? 90 : 170;
var P = [];
for (var i = 0; i < N; i++){
  P.push({
    x: Math.random(), y: Math.random(),
    r: 1 + Math.random() * 2.2,
    c: COLORS[(Math.random() * COLORS.length) | 0],
    a: 0.25 + Math.random() * 0.55,
    vx: (Math.random() - 0.5) * 0.00018,
    vy: (Math.random() - 0.5) * 0.00012,
    tri: Math.random() < 0.6
  });
}
function drawTri(x, y, s, rot){
  ctx.beginPath();
  for (var k = 0; k < 3; k++){
    var a = rot + k * (Math.PI * 2 / 3);
    var px = x + Math.cos(a) * s, py = y + Math.sin(a) * s;
    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}
var t = 0;
function frame_(){
  t += reduce ? 0 : 1;
  ctx.clearRect(0, 0, W, H);
  P.forEach(function(p){
    if (!reduce){
      p.x += p.vx; p.y += p.vy;
      if (p.x < -0.05) p.x = 1.05; if (p.x > 1.05) p.x = -0.05;
      if (p.y < -0.05) p.y = 1.05; if (p.y > 1.05) p.y = -0.05;
    }
    var px = p.x * W, py = p.y * H;
    ctx.globalAlpha = p.a;
    ctx.strokeStyle = p.c; ctx.fillStyle = p.c; ctx.lineWidth = 1;
    if (p.tri){ drawTri(px, py, p.r * 2.2, t * 0.004 + px * 0.01); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(px, py, p.r, 0, Math.PI * 2); ctx.fill(); }
  });
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame_);
}
requestAnimationFrame(frame_);
})();
</script>
</body>
</html>
